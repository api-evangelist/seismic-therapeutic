aid: seismic-therapeutic
name: Seismic Therapeutic
description: >-
  Seismic Therapeutic is a clinical-stage biopharmaceutical company developing
  transformative biologic medicines for autoimmune and inflammatory diseases. The
  company pairs structural biology with machine learning through its proprietary
  IMPACT platform to design multi-functional antibodies and Immunoglobulin Sculpting
  (IgSc) enzymes across cell-mediated, allergic, and antibody-mediated immune
  diseases. Surfaced as a portfolio company of Bessemer Venture Partners, GV, and
  Lightspeed Venture Partners, it was added to the API Evangelist network as a lead
  for enrichment. As a therapeutics R&D company it publishes no public developer or
  API surface at seismictx.com; this profile captures its corporate identity only.
